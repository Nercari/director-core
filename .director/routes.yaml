# The ONLY file in this project naming a provider, model, quota, or price.
# Filled from what the CLIs reported on 2026-07-25 (blueprint §7.2, §7.3).
# preflight refuses to launch on an unresolved alias or a stale entry.

routes:
  ORCH_PRIMARY:
    tool: claude
    version_seen: 2.1.220
    auth: subscription          # Claude Pro, OAuth
    model: default              # harness-selected; the swap drill governs changes
    note: the only route with hooks
    last_verified: 2026-07-26

  ORCH_FALLBACK:
    tool: codex
    version_seen: 0.145.0
    auth: subscription          # "Logged in using ChatGPT"
    model: default
    enforcement: reduced        # no hooks — treat every change as behavior-changing
    forbidden_models:
      - "gpt-oss-*"
    last_verified: 2026-07-26

  EXEC_PRIMARY:
    tool: agy
    version_seen: 1.1.8
    auth: subscription          # Google AI Pro, OAuth
    model: gemini-3.6-flash-medium
    # Historical evidence from 2026-07-26, superseded by the 2026-07-28 probe.
    # There is deliberately no runnable invoke: key while the route is quarantined.
    invoke_historical_2026_07_26_do_not_use: "scripts/exec-jail.sh agy -p --sandbox --mode accept-edits --print-timeout 15m"
    invoke_probe_result_2026_07_26_superseded: "no output, no work, exit without executing — every tool permission auto-denied in headless mode"
    invoke_probe_result_2026_07_28: "Ran headlessly through the jail with no permission-bypass flag, executed a shell command, and created a file when the invocation added the working directory and the tool allowlist covered the tools needed. The allowlist entry must name a real directory path; a partial path prefix did not match."
    # CORRECTED 2026-07-26. This previously read "network: denied" and that was
    # false. A conformance probe proved agy under --sandbox reaches the public
    # network AND holds live gh credentials with repo+workflow scope, and writes
    # outside allowed_paths. --sandbox restricted none of it.
    # Superseded 2026-07-30 by the boundary probe. TCP egress from the restricted
    # account is now closed and measured; see egress_boundary below. The value is
    # kept rather than deleted because it describes the state of an executor run
    # under the OPERATOR's account, which is still open — the boundary is a
    # property of director-exec, not of this tool.
    network: EGRESS_OPEN_UNLESS_RUN_AS_DIRECTOR_EXEC
    gate_credentials: REMOVED_BY_EXEC_JAIL
    quarantined: true                    # NOT USABLE — see blocked_on below
    # Corrected 2026-07-30 (second time). The egress half is now done and
    # measured. Only the jail probe remains between this route and reconsideration.
    blocked_on: "exec-jail has never been probed against agy (#32). TCP egress is closed and measured as of 2026-07-30; UDP/443 is denied by rule but unmeasured."
    jail_verified: false                 # exec-jail was proven against codex, NOT against agy
    enforcement: "scripts/exec-jail.sh empties GH_CONFIG_DIR and nulls git config, so gh is unauthenticated and push cannot authenticate. Probed inside a live jailed codex run, not inferred. MUST be invoked through the jail — the invoke line above is the control."
    residual_risk: "Under the operator's account an executor can still fetch and could exfiltrate. Closed only when run as director-exec, whose boundary was measured 2026-07-30. Running an executor under any other account bypasses the boundary entirely — the rules are SID-scoped, so the account IS the enforcement."
    # A hostname-filtering proxy exists (scripts/egress-proxy.py), its allow list is
    # proven by scripts/egress-proxy-check.py in CI, and as of 2026-07-30 the firewall
    # rules that make it the only available TCP path have been applied and probed.
    # The proxy alone was never the unblock and still is not: it routes only a
    # cooperative process. What closes the path is the pair of SID-scoped Block rules
    # listed below, measured with the machine-wide default left at Allow so the
    # attribution is unambiguous.
    # Corrected 2026-07-30. The value below was NOT_PROVEN and the blocked_on line
    # above said "Egress is open". Both were wrong at the time they were written:
    # two SID-scoped deny-all-outbound rules for the restricted account had been
    # live since an earlier session, with no matching allow rules, so the account
    # had no route out at all. The registry described a machine state that had not
    # existed for days. See docs/evidence/baseline-director-exec-2026-07-30.md.
    # Corrected again 2026-07-30, this time by measurement rather than by reading
    # the machine. The probe ran under director-exec with the machine-wide default
    # left at Allow, so every refusal is attributable to two SID-scoped Block rules
    # and to nothing else. Direct TCP to the model host, the gate, and an arbitrary
    # third host all failed in 11-26 ms with the proxy variables removed. Through
    # the proxy the model host answered and the other two were refused 403.
    # Evidence: docs/evidence/egress-boundary-2026-07-30.md
    egress_boundary: TCP_CLOSED_MEASURED_2026_07_30
    # Named separately because it is NOT covered by the line above and must not be
    # read as covered. QUIC would route around a TCP-only policy. The Block rule
    # denies UDP outbound on every port except 53, so the rule exists — but this
    # curl has no HTTP3 support and the refusal has never been observed. Rule
    # present, traffic unmeasured. Do not upgrade this without a probe that emits
    # a UDP/443 datagram.
    quic_udp_443: DENIED_BY_RULE_NEVER_MEASURED
    # The boundary is carried by the two Block rules. DNS is carved OUT of the UDP
    # Block rule by port range rather than permitted by a sibling Allow rule: an
    # Allow rule for UDP/53 was live and DNS still failed, because Block defeats
    # Allow at equal specificity on this build. Loopback needs no Allow rule at all
    # (Windows does not filter loopback); the one present documents intent only.
    boundary_rules_2026_07_30:
      - "director-exec: deny TCP outbound        Block TCP  any"
      - "director-exec: deny UDP except DNS      Block UDP  1-52,54-65535"
      - "director-exec: allow DNS                Allow UDP  53"
      - "director-exec: allow local proxy        Allow TCP  127.0.0.1:8899"
    # Settled incidentally on 2026-07-30 rather than argued: the restricted account
    # was refused every network probe in 10-16 ms while the operator's account
    # reached the internet on the same machine, under SID-scoped rules. Windows
    # enforces user-scoped outbound filtering for an ordinary console process here.
    localuser_enforcement: VERIFIED_2026_07_30
    # Stated rather than omitted: the model endpoint must stay reachable, and
    # repository content can be placed in a prompt to it. The proxy reduces the
    # exfiltration surface and cannot eliminate it. No hostname allow list can.
    residual_risk_after_proxy: "Exfiltration through the permitted model endpoint itself remains possible by construction."
    forbidden_models:           # agy can serve these; doing so destroys Layer 2
      - "claude-*"
      - "gpt-oss-*"
    last_verified: 2026-07-28

  EXEC_STRONG:
    tool: codex
    version_seen: 0.145.0
    auth: subscription
    model: default
    invoke: scripts/exec-jail.sh codex exec --sandbox workspace-write --json
    # This contract has optional fields by design, but structured output requires every
    # property to be required. Closed properties and validate-result.sh still reject forbidden keys.
    # CORRECTED 2026-07-26. Probed directly under --sandbox workspace-write:
    #   nslookup github.com   exit 0  (DNS resolves)
    #   gh auth status        exit 0  (authenticated)
    #   gh api user           exit 0  (live authenticated API, repo+workflow)
    # git ls-remote failed only on a schannel credential error, not a network
    # block. Seven units ran on this route on 2026-07-25 with the gate reachable.
    network: EGRESS_OPEN
    gate_credentials: REMOVED_BY_EXEC_JAIL
    quarantined: false                   # gate closed 2026-07-26 via exec-jail
    enforcement: "Same control as EXEC_PRIMARY. Verified in a live jailed run: gh unauthenticated, gh api refused, push cannot authenticate."
    residual_risk: "Egress open. See blueprint 21.8."
    use: "DE FACTO PRIMARY as of 2026-07-26. Eleven units have run here; zero on EXEC_PRIMARY. EXEC_PRIMARY remains quarantined because egress is open and its jail has not been probed. Escalation semantics are retained for when EXEC_PRIMARY becomes usable."
    jail_verified: true                  # probed live 2026-07-26: gh dead, push cannot authenticate
    last_verified: 2026-07-26

  EXEC_LOCAL:
    tool: lmstudio
    auth: local
    model: gemma-4-12b-agentic-fable5-composer2.5-v2-3.5x-tau2
    quant: Q4_K_M
    size_gb: 7.38
    state: absent               # absent | candidate | active — §17.1
    blocked_by:
      - capability test not run
      - hermes-codex-harness still Phase-0 only
      - capacity has never bound
      - pipeline Phase 4 incomplete
    last_verified: 2026-07-26

# Capacity states — blueprint §7.4. Set by hand in .director/current-handoff.json;
# operator judgement outranks inference. Detection is reactive: we learn we are
# out by being refused.
capacity_states:
  # auto_merge is forbidden in every state: the capability was removed, not gated.
  A:  { orchestrator: ORCH_PRIMARY,  executor: EXEC_PRIMARY, layer2: cross-vendor, auto_merge: forbidden }
  B:  { orchestrator: ORCH_FALLBACK, executor: EXEC_PRIMARY, layer2: cross-vendor, auto_merge: forbidden }
  C:  { orchestrator: ORCH_PRIMARY,  executor: EXEC_STRONG,  layer2: cross-vendor, auto_merge: forbidden }
  C_prime: { orchestrator: ORCH_PRIMARY, executor: DIRECT,   layer2: SELF-REVIEW,  auto_merge: forbidden }
  D:  { action: publish handoff and stop }
