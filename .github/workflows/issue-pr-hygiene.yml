name: issue-pr-hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * 5"
      timezone: "America/Fortaleza"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: report-open-work
    runs-on: ubuntu-latest

    steps:
      - name: Summarize open issues and pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          now = datetime.now(timezone.utc)

          def fetch(path: str) -> list[dict]:
              req = Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def days_since(value: str) -> int:
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              return (now - dt).days

          pulls = fetch("/pulls?state=open&per_page=100")
          issues = [
              item
              for item in fetch("/issues?state=open&per_page=100")
              if "pull_request" not in item
          ]

          stale_pulls = [pr for pr in pulls if days_since(pr["updated_at"]) >= 7]
          stale_issues = [issue for issue in issues if days_since(issue["updated_at"]) >= 30]

          lines = [
              "### Weekly issue / PR hygiene",
              "",
              f"Open pull requests: {len(pulls)}",
              f"Open issues: {len(issues)}",
              "",
              "#### Pull requests with no update for 7+ days",
          ]

          if stale_pulls:
              for pr in sorted(stale_pulls, key=lambda item: item["updated_at"]):
                  lines.append(
                      f"- #{pr['number']} {pr['title']} "
                      f"({days_since(pr['updated_at'])}d since update) — {pr['html_url']}"
                  )
          else:
              lines.append("- None")

          lines.extend(["", "#### Issues with no update for 30+ days"])

          if stale_issues:
              for issue in sorted(stale_issues, key=lambda item: item["updated_at"]):
                  labels = ", ".join(label["name"] for label in issue.get("labels", []))
                  label_text = f" [{labels}]" if labels else ""
                  lines.append(
                      f"- #{issue['number']} {issue['title']}{label_text} "
                      f"({days_since(issue['updated_at'])}d since update) — {issue['html_url']}"
                  )
          else:
              lines.append("- None")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))

          if stale_pulls or stale_issues:
              print("::warning title=Open work needs triage::See the job summary.")
          PY
